<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market & Co — Shops near you</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        /* ---------------------------------------------------------
           Design tokens
        --------------------------------------------------------- */
        :root {
            --ink: #1F3A34;
            --ink-soft: #2C4B44;
            --paper: #EDEFE3;
            --card: #FFFFFF;
            --marigold: #E2A63B;
            --marigold-dark: #C68A26;
            --brick: #C1552E;
            --line: #D9D3BC;
            --text: #22271F;
            --text-muted: #5B6156;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;

            --radius: 10px;
            --shadow: 0 2px 10px rgba(31, 58, 52, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--text);
        }

        a { color: inherit; }

        h1, h2, h3 { font-family: var(--font-display); margin: 0; color: var(--ink); }

        /* ---------------------------------------------------------
           Header — logo left, search center, auth right
        --------------------------------------------------------- */
        .site-header {
            background: var(--ink);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 32px;
            display: grid;
            grid-template-columns: 1fr minmax(280px, 560px) 1fr;
            align-items: center;
            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            justify-self: start;
        }

        .logo-word {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.35rem;
            color: var(--paper);
            letter-spacing: 0.01em;
        }

        .logo-word em {
            font-style: normal;
            color: var(--marigold);
            margin: 0 1px;
        }

        .search-bar {
            justify-self: center;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--paper);
            border-radius: 999px;
            padding: 10px 18px;
        }

        .search-icon { color: var(--ink); flex-shrink: 0; }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--text);
        }

        .auth-actions {
            display: flex;
            gap: 10px;
            justify-self: end;
        }

        .btn {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 9px 18px;
            border-radius: 999px;
            border: 1.5px solid transparent;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .btn-ghost {
            color: var(--paper);
            border-color: rgba(237, 239, 227, 0.35);
        }
        .btn-ghost:hover { border-color: var(--marigold); color: var(--marigold); }

        .btn-solid {
            background: var(--marigold);
            color: var(--ink);
        }
        .btn-solid:hover { background: var(--marigold-dark); transform: translateY(-1px); }

        .btn-text {
            background: none;
            border: none;
            color: var(--ink-soft);
            text-decoration: underline;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        /* Signature motif: an awning stripe beneath the header, like a market stall canopy */
        .awning-stripe {
            height: 10px;
            background: repeating-linear-gradient(
                -45deg,
                var(--marigold) 0px, var(--marigold) 18px,
                var(--brick) 18px, var(--brick) 36px
            );
        }

        /* ---------------------------------------------------------
           Layout — left filter rail + main content
        --------------------------------------------------------- */
        .layout {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 36px;
            align-items: start;
        }

        .filters {
            position: sticky;
            top: 96px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
        }

        .filters-title {
            font-size: 1.1rem;
            margin-bottom: 14px;
        }

        .filter-group {
            padding: 16px 0;
            border-top: 1px solid var(--line);
        }
        .filter-group:first-of-type { border-top: none; padding-top: 0; }

        .filter-group h3 {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .checkbox-list, .radio-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-row, .radio-row, .switch-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .empty-hint {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
        }

        .price-toggle {
            display: flex;
            gap: 8px;
        }

        .price-btn {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 7px 12px;
            border-radius: 6px;
            border: 1.5px solid var(--line);
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
        }

        .price-btn.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--marigold);
        }

        #clear-filters { margin-top: 6px; }

        /* ---------------------------------------------------------
           Shop grid + cards
        --------------------------------------------------------- */
        .grid-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .grid-header h1 { font-size: 1.6rem; }

        .result-count {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .loading-state, .empty-state, .error-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-family: var(--font-body);
        }

        .shop-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .shop-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(31, 58, 52, 0.14);
        }

        .card-media {
            position: relative;
            height: 150px;
            background-size: cover;
            background-position: center;
            background-color: var(--line);
        }

        /* Signature motif: a hanging price tag on each card, like a stall price ticket */
        .price-tag {
            position: absolute;
            top: 10px;
            right: -6px;
            background: var(--brick);
            color: #fff;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.78rem;
            padding: 5px 12px 5px 10px;
            clip-path: polygon(14% 0, 100% 0, 100% 100%, 14% 100%, 0 50%);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .card-top h3 {
            font-size: 1.05rem;
            line-height: 1.25;
        }

        .rating {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--marigold-dark);
            white-space: nowrap;
        }

        .category-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 0;
        }

        .description {
            font-size: 0.88rem;
            color: var(--text);
            margin: 4px 0 0;
            line-height: 1.4;
        }

        .card-meta {
            margin-top: auto;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .status {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .status.open { background: rgba(31, 58, 52, 0.1); color: var(--ink); }
        .status.closed { background: rgba(193, 85, 46, 0.1); color: var(--brick); }

        /* ---------------------------------------------------------
           Responsive
        --------------------------------------------------------- */
        @media (max-width: 860px) {
            .header-inner {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .logo, .search-bar, .auth-actions { justify-self: stretch; }
            .layout {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .filters {
                position: static;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .shop-card, .btn { transition: none; }
        }

        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--marigold);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <!-- Logo: replace the inline SVG below with your real logo <img> if you have one,
             e.g. <img src="/images/logo.png" alt="Market & Co" width="34" height="34"> -->
        <a class="logo" href="/">
            <svg class="logo-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 12 L6 4 H28 L30 12 Z" fill="#E2A63B"/>
                <rect x="5" y="12" width="24" height="17" rx="1.5" fill="#1F3A34"/>
                <path d="M11 12 V16 A6 6 0 0 0 23 16 V12" stroke="#EDEFE3" stroke-width="1.6" fill="none"/>
            </svg>
            <span class="logo-word">Market<em>&amp;</em>Co</span>
        </a>

        <form class="search-bar" role="search" id="search-form">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6"/>
                <path d="M16 16L12.5 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="search" id="search-input" placeholder='Search shops, e.g. "coffee" or "tailor"' aria-label="Search shops">
        </form>

        <!-- API INTEGRATION: point these at your real auth/signup pages or open a modal -->
        <div class="auth-actions">
            <a href="/login" class="btn btn-ghost">Log in</a>
            <a href="/register" class="btn btn-solid">Sign up</a>
        </div>
    </div>
    <div class="awning-stripe" aria-hidden="true"></div>
</header>

<div class="layout">

    <aside class="filters" aria-label="Filter shops">
        <h2 class="filters-title">Filter</h2>

        <div class="filter-group">
            <h3>Category</h3>
            <!--
                API INTEGRATION: this checkbox list is hardcoded from MOCK_SHOPS below.
                Replace it by calling your backend's categories endpoint on page load, e.g.:

                    GET /api/shops/categories  -> ["Cafe", "Books", "Grocery", ...]

                and rendering one <label class="checkbox-row"> per category into
                #category-filters, the same shape as the static markup below.
            -->
            <div class="checkbox-list" id="category-filters">
                <!-- populated by renderCategoryFilters() below from MOCK_SHOPS;
                     replace that function's data source with your API response -->
            </div>
        </div>

        <div class="filter-group">
            <h3>Minimum rating</h3>
            <div class="radio-list">
                <label class="radio-row"><input type="radio" name="minRating" value=""><span>Any</span></label>
                <label class="radio-row"><input type="radio" name="minRating" value="4.5"><span>4.5 &amp; up</span></label>
                <label class="radio-row"><input type="radio" name="minRating" value="4"><span>4.0 &amp; up</span></label>
                <label class="radio-row"><input type="radio" name="minRating" value="3"><span>3.0 &amp; up</span></label>
            </div>
        </div>

        <div class="filter-group">
            <h3>Price</h3>
            <div class="price-toggle">
                <button type="button" class="price-btn" data-price="1">$</button>
                <button type="button" class="price-btn" data-price="2">$$</button>
                <button type="button" class="price-btn" data-price="3">$$$</button>
            </div>
        </div>

        <div class="filter-group">
            <label class="switch-row">
                <input type="checkbox" id="open-now-toggle">
                <span>Open now</span>
            </label>
        </div>

        <button type="button" id="clear-filters" class="btn btn-text">Clear all filters</button>
    </aside>

    <main class="shop-main">
        <div class="grid-header">
            <h1>Shops near you</h1>
            <span class="result-count" id="result-count" aria-live="polite"></span>
        </div>

        <!-- API INTEGRATION: this grid is filled by loadShops() below, currently from MOCK_SHOPS.
             Swap the data source for a fetch() call to your controller (see loadShops()). -->
        <div id="shop-grid" class="shop-grid">
            <p class="loading-state">Loading shops…</p>
        </div>
    </main>

</div>

<script>
    /* =========================================================
       ============  BACKEND INTEGRATION POINT  =================
       =========================================================
       Right now this page runs entirely on the MOCK_SHOPS array below so you
       can preview it standalone. When your backend controller is ready:

       1. Delete/ignore MOCK_SHOPS (or keep it as a fallback for local dev).
       2. Set API_BASE to your real endpoint, e.g. '/api/shops' or a full URL
          if the API is hosted separately (e.g. 'https://api.yoursite.com/shops').
       3. In loadShops(), replace the "MOCK MODE" block with the "REAL API"
          block that's already written below (commented out) — it calls:

              GET {API_BASE}?search=...&category=...&minRating=...&openNow=...&maxPrice=...

          and expects a JSON array of shop objects shaped like:

              {
                "id": 1,
                "name": "Kettle & Kin",
                "category": "Cafe",
                "description": "Slow-drip coffee...",
                "imageUrl": "https://...",
                "address": "12 Elm Street",
                "rating": 4.7,
                "reviewCount": 218,
                "openNow": true,
                "priceTier": 1
              }

       4. In renderCategoryFilters(), replace the MOCK category derivation with a
          fetch to GET {API_BASE}/categories, which should return a plain string
          array, e.g. ["Cafe", "Books", "Grocery"].
       ========================================================= */

    const API_BASE = '/api/shops'; // <-- API INTEGRATION: change if your endpoint differs

    // MOCK DATA — remove once the real API is wired up. Keeps the page previewable standalone.
    const MOCK_SHOPS = [
        { id: 1, name: "Kettle & Kin", category: "Cafe", description: "Slow-drip coffee and sourdough toast in a plant-filled corner spot.", imageUrl: "https://picsum.photos/seed/kettleandkin/480/360", address: "12 Elm Street", rating: 4.7, reviewCount: 218, openNow: true, priceTier: 1 },
        { id: 2, name: "Northside Hardware", category: "Hardware", description: "Family-run hardware store stocking everything from screws to power tools.", imageUrl: "https://picsum.photos/seed/northsidehw/480/360", address: "88 Foundry Road", rating: 4.5, reviewCount: 132, openNow: true, priceTier: 2 },
        { id: 3, name: "Paper Moon Books", category: "Books", description: "Independent bookstore with a strong local-authors shelf and a reading nook.", imageUrl: "https://picsum.photos/seed/papermoon/480/360", address: "5 Lantern Lane", rating: 4.9, reviewCount: 341, openNow: false, priceTier: 1 },
        { id: 4, name: "Verde Greengrocer", category: "Grocery", description: "Fresh produce sourced from nearby farms, restocked daily.", imageUrl: "https://picsum.photos/seed/verdegreen/480/360", address: "27 Market Row", rating: 4.4, reviewCount: 96, openNow: true, priceTier: 1 },
        { id: 5, name: "Threadbare Tailoring", category: "Clothing", description: "Custom tailoring, alterations, and small-batch menswear.", imageUrl: "https://picsum.photos/seed/threadbare/480/360", address: "19 Cobble Court", rating: 4.6, reviewCount: 74, openNow: false, priceTier: 3 },
        { id: 6, name: "Anchor & Awl Leatherworks", category: "Crafts", description: "Handmade leather goods, made and repaired on site.", imageUrl: "https://picsum.photos/seed/anchorawl/480/360", address: "3 Harbor Walk", rating: 4.8, reviewCount: 58, openNow: true, priceTier: 2 },
        { id: 7, name: "Bramble Flower Co.", category: "Florist", description: "Seasonal, locally grown bouquets and same-day delivery.", imageUrl: "https://picsum.photos/seed/brambleflower/480/360", address: "41 Garden Terrace", rating: 4.7, reviewCount: 165, openNow: true, priceTier: 2 },
        { id: 8, name: "The Corner Cobbler", category: "Services", description: "Shoe repair, key cutting, and watch batteries while you wait.", imageUrl: "https://picsum.photos/seed/cornercobbler/480/360", address: "9 Mill Street", rating: 4.3, reviewCount: 41, openNow: false, priceTier: 1 },
        { id: 9, name: "Solstice Records", category: "Music", description: "New and second-hand vinyl, with weekend in-store listening sessions.", imageUrl: "https://picsum.photos/seed/solsticerecords/480/360", address: "62 Vinyl Row", rating: 4.9, reviewCount: 203, openNow: true, priceTier: 2 }
    ];

    const grid = document.getElementById('shop-grid');
    const resultCount = document.getElementById('result-count');
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const categoryFilters = document.getElementById('category-filters');
    const openNowToggle = document.getElementById('open-now-toggle');
    const priceButtons = document.querySelectorAll('.price-btn');
    const clearFiltersBtn = document.getElementById('clear-filters');

    let selectedPrice = null;
    let debounceTimer = null;

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
    }

    function priceLabel(tier) {
        return '$'.repeat(tier || 1);
    }

    // API INTEGRATION: builds the query string sent to GET {API_BASE}
    function buildQuery() {
        const params = new URLSearchParams();

        const search = searchInput.value.trim();
        if (search) params.set('search', search);

        const checkedCategory = categoryFilters.querySelector('input[name="category"]:checked');
        if (checkedCategory) params.set('category', checkedCategory.value);

        const checkedRating = document.querySelector('input[name="minRating"]:checked');
        if (checkedRating && checkedRating.value) params.set('minRating', checkedRating.value);

        if (openNowToggle.checked) params.set('openNow', 'true');

        if (selectedPrice) params.set('maxPrice', selectedPrice);

        return params.toString();
    }

    // Renders the category checkboxes in the left sidebar.
    function renderCategoryFilters(categories) {
        if (!categories.length) {
            categoryFilters.innerHTML = '<p class="empty-hint">Categories will appear here once shops are added.</p>';
            return;
        }
        categoryFilters.innerHTML = categories.map(cat => `
            <label class="checkbox-row">
                <input type="checkbox" name="category" value="${escapeHtml(cat)}">
                <span>${escapeHtml(cat)}</span>
            </label>
        `).join('');
    }

    function renderShops(shops) {
        if (!shops.length) {
            grid.innerHTML = '<p class="empty-state">No shops match those filters yet. Try widening your search.</p>';
            resultCount.textContent = '';
            return;
        }

        resultCount.textContent = `${shops.length} shop${shops.length === 1 ? '' : 's'}`;

        grid.innerHTML = shops.map(shop => `
            <article class="shop-card">
                <div class="card-media" style="background-image:url('${escapeHtml(shop.imageUrl || '')}')">
                    <span class="price-tag">${priceLabel(shop.priceTier)}</span>
                </div>
                <div class="card-body">
                    <div class="card-top">
                        <h3>${escapeHtml(shop.name)}</h3>
                        <span class="rating">★ ${shop.rating != null ? Number(shop.rating).toFixed(1) : '—'}</span>
                    </div>
                    <p class="category-label">${escapeHtml(shop.category)}</p>
                    <p class="description">${escapeHtml(shop.description || '')}</p>
                    <div class="card-meta">
                        <span class="address">${escapeHtml(shop.address || '')}</span>
                        <span class="status ${shop.openNow ? 'open' : 'closed'}">${shop.openNow ? 'Open now' : 'Closed'}</span>
                    </div>
                </div>
            </article>
        `).join('');
    }

    // Client-side filtering of MOCK_SHOPS, mirroring what the real API's
    // search/category/minRating/openNow/maxPrice params will do server-side.
    function filterMockShops() {
        const params = new URLSearchParams(buildQuery());
        const search = (params.get('search') || '').toLowerCase();
        const category = params.get('category');
        const minRating = params.get('minRating') ? parseFloat(params.get('minRating')) : null;
        const openNow = params.get('openNow') === 'true';
        const maxPrice = params.get('maxPrice') ? parseInt(params.get('maxPrice'), 10) : null;

        return MOCK_SHOPS.filter(shop => {
            if (search && !(shop.name.toLowerCase().includes(search) || (shop.description || '').toLowerCase().includes(search))) return false;
            if (category && shop.category !== category) return false;
            if (minRating && shop.rating < minRating) return false;
            if (openNow && !shop.openNow) return false;
            if (maxPrice && shop.priceTier > maxPrice) return false;
            return true;
        });
    }

    async function loadShops() {
        grid.innerHTML = '<p class="loading-state">Loading shops…</p>';
        resultCount.textContent = '';

        try {
            // ---------- MOCK MODE (active) ----------
            // Simulates network latency so the loading state is visible; remove this
            // setTimeout wrapper once you switch to the real fetch() call below.
            await new Promise(resolve => setTimeout(resolve, 150));
            const shops = filterMockShops();
            renderShops(shops);

            // ---------- REAL API (uncomment when your controller is ready) ----------
            // const query = buildQuery();
            // const response = await fetch(`${API_BASE}${query ? '?' + query : ''}`);
            // if (!response.ok) throw new Error(`Request failed: ${response.status}`);
            // const shops = await response.json();
            // renderShops(shops);

        } catch (err) {
            console.error('Failed to load shops', err);
            grid.innerHTML = '<p class="error-state">Couldn\'t load shops right now. Please try again shortly.</p>';
        }
    }

    function debouncedLoad() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadShops, 250);
    }

    searchForm.addEventListener('submit', e => {
        e.preventDefault();
        loadShops();
    });
    searchInput.addEventListener('input', debouncedLoad);
    categoryFilters.addEventListener('change', loadShops);
    document.querySelectorAll('input[name="minRating"]').forEach(el => el.addEventListener('change', loadShops));
    openNowToggle.addEventListener('change', loadShops);

    priceButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const value = btn.dataset.price;
            const isActive = btn.classList.contains('active');
            priceButtons.forEach(b => b.classList.remove('active'));
            if (!isActive) {
                btn.classList.add('active');
                selectedPrice = value;
            } else {
                selectedPrice = null;
            }
            loadShops();
        });
    });

    clearFiltersBtn.addEventListener('click', () => {
        searchInput.value = '';
        categoryFilters.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
        document.querySelectorAll('input[name="minRating"]').forEach(el => el.checked = false);
        openNowToggle.checked = false;
        priceButtons.forEach(b => b.classList.remove('active'));
        selectedPrice = null;
        loadShops();
    });

    // API INTEGRATION: on real-API mode, replace this line with a fetch to
    // GET {API_BASE}/categories and call renderCategoryFilters(data) with the result.
    renderCategoryFilters([...new Set(MOCK_SHOPS.map(s => s.category))].sort());

    loadShops();
</script>
</body>
</html>
